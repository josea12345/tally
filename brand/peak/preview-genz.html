<!doctype html>
<html><head><meta charset="utf-8"><style>
  body { margin:0; font-family:"Liberation Sans","DejaVu Sans",sans-serif; }
  .panel { padding:48px 56px; }
  .black { background:#0B0B0C; }
  .ink { background:#0A0D18; }
  .label { font-size:19px; letter-spacing:.18em; text-transform:uppercase; color:#8B93B8; margin-bottom:26px; font-weight:700;}
  .row { display:flex; gap:44px; align-items:flex-start; }
</style></head>
<body>

<div class="panel black">
  <div class="label">Wordmark — lime on black (your reference)</div>
  <svg width="880" height="495" viewBox="0 0 640 360">
    <g transform="rotate(-5 320 190)" fill="none" stroke="#D8F651" stroke-linecap="round" stroke-linejoin="round">
      <path d="M120 252 L120 102 L152 102 A30 30 0 0 1 152 162 L120 162" stroke-width="34"/>
      <path d="M264 106 L206 106 L206 250 L266 250 M206 177 L254 177" stroke-width="33"/>
      <path d="M290 252 L348 94 L408 252" stroke-width="38"/>
      <path d="M442 100 L442 252 M502 106 L448 170 L510 250" stroke-width="35"/>
      <path d="M348 56 L348 26 M315 64 L296 40 M381 64 L400 40" stroke-width="13"/>
    </g>
  </svg>
</div>

<div class="panel ink">
  <div class="label">Same drawing — app blue, for comparison</div>
  <svg width="880" height="495" viewBox="0 0 640 360">
    <g transform="rotate(-5 320 190)" fill="none" stroke="#45C8FF" stroke-linecap="round" stroke-linejoin="round">
      <path d="M120 252 L120 102 L152 102 A30 30 0 0 1 152 162 L120 162" stroke-width="34"/>
      <path d="M264 106 L206 106 L206 250 L266 250 M206 177 L254 177" stroke-width="33"/>
      <path d="M290 252 L348 94 L408 252" stroke-width="38"/>
      <path d="M442 100 L442 252 M502 106 L448 170 L510 250" stroke-width="35"/>
      <path d="M348 56 L348 26 M315 64 L296 40 M381 64 L400 40" stroke-width="13"/>
    </g>
  </svg>
</div>

<div class="panel black">
  <div class="label">Icons — the A by itself</div>
  <div class="row">
    <svg width="280" height="280" viewBox="0 0 512 512">
      <rect x="8" y="8" width="496" height="496" rx="112" fill="#101012"/>
      <g fill="none" stroke="#D8F651" stroke-linecap="round" stroke-linejoin="round">
        <path d="M156 384 L256 128 L356 384" stroke-width="46"/>
        <path d="M256 82 L256 40 M212 96 L188 58 M300 96 L324 58" stroke-width="17"/>
      </g>
    </svg>
    <svg width="280" height="280" viewBox="0 0 512 512">
      <rect x="8" y="8" width="496" height="496" rx="112" fill="#D8F651"/>
      <g fill="none" stroke="#0B0B0C" stroke-linecap="round" stroke-linejoin="round">
        <path d="M156 384 L256 128 L356 384" stroke-width="46"/>
        <path d="M256 82 L256 40 M212 96 L188 58 M300 96 L324 58" stroke-width="17"/>
      </g>
    </svg>
    <svg width="280" height="280" viewBox="0 0 512 512">
      <circle cx="256" cy="256" r="248" fill="#101012"/>
      <g fill="none" stroke="#D8F651" stroke-linecap="round" stroke-linejoin="round">
        <path d="M156 384 L256 128 L356 384" stroke-width="46"/>
        <path d="M256 82 L256 40 M212 96 L188 58 M300 96 L324 58" stroke-width="17"/>
      </g>
    </svg>
  </div>
</div>

</body></html>
