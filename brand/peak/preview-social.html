<!doctype html>
<html><head><meta charset="utf-8"><style>
  body { margin:0; font-family:"Liberation Sans","DejaVu Sans",sans-serif; background:#0A0D18; }
  .panel { padding:52px 64px; border-bottom:2px solid #1B2138; }
  .label { font-size:20px; letter-spacing:.18em; text-transform:uppercase; color:#8B93B8; margin-bottom:30px; font-weight:700;}
  .row { display:flex; gap:56px; align-items:flex-start; }
</style></head>
<body>

<div class="panel">
  <div class="label">A — Friendly caps, flag on top</div>
  <svg width="780" height="286" viewBox="0 0 520 220">

    <path d="M 254 160 L 300 70 L 311 93 L 322 79 L 352 160 Z" fill="#45C8FF" stroke="#45C8FF" stroke-width="10" stroke-linejoin="round"/>
    <rect x="297.5" y="36" width="5" height="38" rx="2.5" fill="#F5F8FF"/>
    <path d="M 302 36 L 330 45 L 302 55 Z" fill="#FFC24B"/>
    <text x="362" y="160" font-family="Liberation Sans, DejaVu Sans, sans-serif" font-size="128" font-weight="700" letter-spacing="2" fill="#F5F8FF">K</text>
  </svg>
</div>

<div class="panel">
  <div class="label">B — Lowercase, like a friend group</div>
  <svg width="760" height="300" viewBox="0 0 460 220">
    <text x="66" y="168" font-family="DejaVu Sans, sans-serif" font-size="118" font-weight="700" letter-spacing="1" fill="#F5F8FF">pe</text>

    <rect x="267.5" y="79" width="5" height="28" rx="2.5" fill="#F5F8FF"/>
    <path d="M 272 79 L 295 87 L 272 96 Z" fill="#FFC24B"/>
    <text x="312" y="168" font-family="DejaVu Sans, sans-serif" font-size="118" font-weight="700" letter-spacing="1" fill="#F5F8FF">k</text>
  </svg>
</div>

<div class="panel">
  <div class="label">C — Icons: the pin, and the squircle</div>
  <div class="row">
    <svg width="290" height="290" viewBox="0 0 512 512">
      <defs>
        <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#5BD2FF"/>
          <stop offset="1" stop-color="#1E9FE0"/>
        </linearGradient>
      </defs>
      <path d="M 256 40 C 148 40 72 120 72 216 C 72 342 256 472 256 472 C 256 472 440 342 440 216 C 440 120 364 40 256 40 Z" fill="url(#g1)"/>
      <path d="M 172 272 L 238 166 L 253 197 L 264 177 L 340 272 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="10" stroke-linejoin="round"/>
      <rect x="235" y="132" width="6" height="38" rx="3" fill="#FFFFFF"/>
      <path d="M 241 132 L 272 141 L 241 151 Z" fill="#FFC24B"/>
    </svg>
    <svg width="290" height="290" viewBox="0 0 512 512">
      <defs>
        <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#5BD2FF"/>
          <stop offset="1" stop-color="#1E9FE0"/>
        </linearGradient>
      </defs>
      <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#g2)"/>
      <path d="M 250 362 L 318 234 L 392 362 Z" fill="#FFFFFF" opacity="0.4"/>
      <path d="M 116 362 L 216 174 L 239 224 L 255 190 L 332 362 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round"/>
      <rect x="213" y="140" width="6" height="38" rx="3" fill="#FFFFFF"/>
      <path d="M 219 140 L 252 150 L 219 161 Z" fill="#FFC24B"/>
    </svg>
  </div>
</div>

</body></html>
